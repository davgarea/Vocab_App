name: Build APK

# Builds a debug APK on every push and publishes it at a fixed link:
# https://github.com/davgarea/Vocab_App/releases/download/latest/CharlinGO.apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and sync web code into Android
        run: |
          npm ci
          npx cap sync android

      # Fixed debug key so each new APK installs over the previous one
      - name: Use the shared debug keystore
        run: |
          mkdir -p ~/.android
          cp .github/ci/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CharlinGO.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CharlinGO-apk
          path: CharlinGO.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CharlinGO.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build (${GITHUB_REF_NAME})" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}."
